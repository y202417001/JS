<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>자격증 나열</title>

    <style>
        /* 전체적인 화면 박스 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            margin: 0;
            padding: 30px;
        }

        /* 자격증 나열하는 컨테이너 박스로 묶기 */
        .certificate-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        /* 크게 보이도록 제목 설정 */
        h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
        }

        /* 자격증별로 나누어진 목록 */
        .certificate-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        /* 자격증 버튼 */
        .certificate-list button {
            padding: 25px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* 마우스 커서를 올리면 반응하도록 */
        .certificate-list button:hover {
            background-color: #333;
            color: white;
            transform: translateY(-3px);
        }

        /* 버튼만들어서 자격증별로 각각 선택하도록 */
        .certificate-list button.active {
            background-color: #333;
            color: white;
            border-color: #333;
        }

        /* 선택 결과 창 */
        #result {
            margin-top: 35px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            background-color: white;
            border-radius: 10px;
            min-height: 25px;
        }

        /* 모바일 화면
        @media (max-width: 600px) {
            .certificate-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            h2 {
                font-size: 23px;
            }

            .certificate-list button {
                padding: 20px 10px;
                font-size: 14px;
            }    
            }
                */
    </style>

</head>

<body>

    <!-- 자격증 화면 -->
    <div class="certificate-container">

        <!-- 제목 -->
        <h2>자격증 종류</h2>

        <!-- 자격증 버튼 목록 -->
        <div class="certificate-list">

            <button onclick="selectBox(this, '정보처리기사')">
                정보처리기사
            </button>

            <button onclick="selectBox(this, '컴퓨터활용능력')">
                컴퓨터활용능력
            </button>

            <button onclick="selectBox(this, '네트워크관리사')">
                네트워크관리사
            </button>

            <button onclick="selectBox(this, 'SQLD')">
                SQLD
            </button>

            <button onclick="selectBox(this, '리눅스마스터')">
                리눅스마스터
            </button>

            <button onclick="selectBox(this, '정보보안기사')">
                정보보안기사
            </button>

        </div>

        <!-- 원하는 자격증을 선택하였을 때와 선택 결과가 보이도록 -->
        <div id="result">
            원하는 자격증을 선택해 주세요.
        </div>

    </div>

    <script>

        function selectBox(button, name) {

            // 결과 출력 영역 선택하기
            const result = document.getElementById("result");

            // 모든 버튼 선택하기
            const buttons = document.querySelectorAll(
                ".certificate-list button"
            );

            // 기존 선택의 대한 효과 제거 부분
            buttons.forEach(function(item) {
                item.classList.remove("active");
            });

            // 클릭한 버튼과 선택 효과 추가
            button.classList.add("active");

            // 선택 결과와 출력하기
            result.textContent = name + " 자격증을 선택했습니다.";

        }

    </script>

</body>
</html>
