<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 합격문고</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="util">
    <div class="wrap util-inner">
      <p>자격증 도서를 한곳에서</p>
      <nav class="util-links">
        <a href="index.html">홈</a>
        <span id="guest-menu">
          <a href="login.html">로그인</a>
          <a href="signup.html">회원가입</a>
        </span>
        <span id="member-menu" style="display:none">
          <span id="member-name"></span>
          <button type="button" onclick="logout()">로그아웃</button>
        </span>
        <a href="cart.html">장바구니<span class="badge" id="cart-count" style="display:none">0</span></a>
      </nav>
    </div>
  </div>
  <header class="header">
    <div class="wrap header-main">
      <a class="logo" href="index.html">
        <span class="logo-mark">합</span>
        <span><strong>합격문고</strong><small>자격증 전문서점</small></span>
      </a>
      <form class="search" action="cart.html" method="get">
        <input type="search" name="q" placeholder="자격증 또는 도서명을 검색하세요">
        <button type="submit">검색</button>
      </form>
    </div>
  </header>

  <main class="page">
    <div class="auth-card wide">
      <h1>회원가입</h1>
      <p class="lead">주문에 사용할 회원 정보를 입력해 주세요.</p>
      <form onsubmit="return doSignup()">
        <p id="signup-error" class="form-error"></p>
        <label class="field">
          <span>이름</span>
          <input id="name" placeholder="홍길동">
        </label>
        <label class="field">
          <span>아이디</span>
          <input id="user-id" placeholder="4글자 이상">
        </label>
        <label class="field">
          <span>비밀번호</span>
          <span class="pw-wrap">
            <input id="signup-password" type="password" placeholder="6자 이상">
            <button type="button" onclick="togglePw('signup-password')">표시</button>
          </span>
        </label>
        <label class="field">
          <span>비밀번호 확인</span>
          <input id="signup-password2" type="password" placeholder="비밀번호를 다시 입력">
        </label>
        <label class="field">
          <span>이메일</span>
          <input id="email" placeholder="name@email.com">
        </label>
        <label class="field">
          <span>휴대폰</span>
          <input id="phone" placeholder="010-1234-5678">
        </label>
        <label class="checkline">
          <input id="agree" type="checkbox">
          <span>개인정보 수집 및 이용에 동의합니다.</span>
        </label>
        <div class="stack">
          <button class="btn btn-primary btn-block" type="submit">가입하기</button>
          <a class="btn btn-ghost btn-block" href="login.html">로그인으로 돌아가기</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <strong>합격문고</strong>
        <p>회원 정보와 장바구니는 이 브라우저에만 저장됩니다.</p>
      </div>
      <nav>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <a href="cart.html">장바구니</a>
      </nav>
    </div>
  </footer>
  <script src="js/common.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
