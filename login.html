<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 합격문고</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="util">
    <div class="wrap util-inner">
      <p>자격증 도서를 한곳에서</p>
      <nav class="util-links">
        <a href="index.html">홈</a>
        <span id="guest-menu">
          <a href="login.html">로그인</a>
          <a href="signup.html">회원가입</a>
        </span>
        <span id="member-menu" style="display:none">
          <span id="member-name"></span>
          <button type="button" onclick="logout()">로그아웃</button>
        </span>
        <a href="cart.html">장바구니<span class="badge" id="cart-count" style="display:none">0</span></a>
      </nav>
    </div>
  </div>
  <header class="header">
    <div class="wrap header-main">
      <a class="logo" href="index.html">
        <span class="logo-mark">합</span>
        <span><strong>합격문고</strong><small>자격증 전문서점</small></span>
      </a>
      <form class="search" action="cart.html" method="get">
        <input type="search" name="q" placeholder="자격증 또는 도서명을 검색하세요">
        <button type="submit">검색</button>
      </form>
    </div>
  </header>

  <main class="page">
    <div class="auth-card">
      <h1>로그인</h1>
      <p class="lead">합격문고 회원 로그인</p>
      <p id="joined" class="banner" style="display:none">회원가입이 완료되었습니다. 로그인해 주세요.</p>
      <p id="already" class="banner" style="display:none"><strong id="already-name"></strong>님은 이미 로그인되어 있습니다. <a href="cart.html">장바구니로 이동</a></p>

      <form onsubmit="return doLogin()">
        <p id="login-error" class="form-error"></p>
        <label class="field">
          <span>아이디</span>
          <input id="user-id" placeholder="아이디">
        </label>
        <label class="field">
          <span>비밀번호</span>
          <span class="pw-wrap">
            <input id="password" type="password" placeholder="비밀번호">
            <button type="button" onclick="togglePw('password')">표시</button>
          </span>
        </label>
        <div class="stack">
          <button class="btn btn-primary btn-block" type="submit">로그인</button>
          <a class="btn btn-ghost btn-block" href="signup.html">회원가입</a>
        </div>
      </form>

      <div class="help-row">
        <button type="button" onclick="showBox('find-box')">아이디 찾기</button>
        <span>|</span>
        <button type="button" onclick="showBox('reset-box')">비밀번호 찾기</button>
      </div>

      <div id="find-box" class="demo-box" style="display:none">
        <strong>아이디 찾기</strong>
        <label class="field"><span>이름</span><input id="find-name"></label>
        <label class="field"><span>이메일</span><input id="find-email"></label>
        <button class="btn btn-primary" type="button" onclick="findMyId()">찾기</button>
        <p id="find-result"></p>
      </div>

      <div id="reset-box" class="demo-box" style="display:none">
        <strong>비밀번호 재설정</strong>
        <label class="field"><span>아이디</span><input id="reset-id"></label>
        <label class="field"><span>이메일</span><input id="reset-email"></label>
        <label class="field"><span>새 비밀번호</span><input id="reset-password" type="password"></label>
        <label class="field"><span>새 비밀번호 확인</span><input id="reset-password2" type="password"></label>
        <button class="btn btn-primary" type="button" onclick="resetPw()">변경</button>
        <p id="reset-result"></p>
      </div>

      <div class="demo-box">
        <strong>체험 계정</strong>
        <p>아이디 demo · 비밀번호 demo1234</p>
        <button type="button" onclick="fillDemo()">체험 계정 입력</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <strong>합격문고</strong>
        <p>회원 정보와 장바구니는 이 브라우저에만 저장됩니다.</p>
      </div>
      <nav>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <a href="cart.html">장바구니</a>
      </nav>
    </div>
  </footer>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
