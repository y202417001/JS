<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장바구니 | 합격문고</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="util">
    <div class="wrap util-inner">
      <p>자격증 도서를 한곳에서</p>
      <nav class="util-links">
        <a href="index.html">홈</a>
        <span id="guest-menu">
          <a href="login.html">로그인</a>
          <a href="signup.html">회원가입</a>
        </span>
        <span id="member-menu" style="display:none">
          <span id="member-name"></span>
          <button type="button" onclick="logout()">로그아웃</button>
        </span>
        <a href="cart.html">장바구니<span class="badge" id="cart-count" style="display:none">0</span></a>
      </nav>
    </div>
  </div>
  <header class="header">
    <div class="wrap header-main">
      <a class="logo" href="index.html">
        <span class="logo-mark">합</span>
        <span><strong>합격문고</strong><small>자격증 전문서점</small></span>
      </a>
      <form class="search" action="cart.html" method="get">
        <input type="search" name="q" placeholder="자격증 또는 도서명을 검색하세요">
        <button type="submit">검색</button>
      </form>
    </div>
  </header>

  <main class="page">
    <div class="wrap">
      <h1 id="cart-title">장바구니</h1>
      <p id="message" class="hint"></p>
      <div class="cart-layout">
        <div id="cart-list"></div>
        <aside class="summary" id="cart-sum"></aside>
      </div>

      <section class="section" id="catalog">
        <div class="section-head">
          <h2 id="book-title">자격증 도서 담기</h2>
          <a class="clear-filter" href="cart.html#catalog">전체 도서 보기</a>
        </div>
        <div class="chips">
          <a class="chip" href="cart.html#catalog">전체</a>
          <a class="chip" href="cart.html?cat=정처기#catalog">정처기</a>
          <a class="chip" href="cart.html?cat=컴활#catalog">컴활</a>
          <a class="chip" href="cart.html?cat=SQLD#catalog">SQLD</a>
          <a class="chip" href="cart.html?cat=네트워크관리사#catalog">네트워크관리사</a>
          <a class="chip" href="cart.html?cat=리눅스 마스터#catalog">리눅스 마스터</a>
          <a class="chip" href="cart.html?cat=정보보안기사#catalog">정보보안기사</a>
        </div>
        <div class="catalog-grid" id="book-list"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <strong>합격문고</strong>
        <p>회원 정보와 장바구니는 이 브라우저에만 저장됩니다.</p>
      </div>
      <nav>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <a href="cart.html">장바구니</a>
      </nav>
    </div>
  </footer>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
